# Базовий набір власних правил Semgrep для цього проєкту.
# Запускаються разом із реєстровими правилами (--config auto) локально і в CI.
rules:
  - id: sql-injection-fstring
    message: SQL-запит зібрано з рядка (f-string/конкатенація/format). Використовуйте параметризований запит з '?'.
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-89: SQL Injection", owasp: "A03:2021 Injection"}
    patterns:
      - pattern-either:
          - pattern: $CUR.execute(f"...", ...)
          - pattern: |
              $SQL = f"..."
              ...
              $CUR.execute($SQL, ...)
          - pattern: $CUR.execute("..." + $X, ...)
          - pattern: $CUR.execute("...".format(...), ...)

  - id: flask-reflected-xss-fstring
    message: Дані запиту повертаються як HTML без екранування (reflected XSS). Використовуйте шаблон Jinja2 або markupsafe.escape().
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-79: Cross-site Scripting", owasp: "A03:2021 Injection"}
    patterns:
      - pattern-inside: |
          $V = request.args.get(...)
          ...
      - pattern: return f"...{$V}..."

  - id: plaintext-password-comparison
    message: Пароль порівнюється напряму, тобто зберігається відкритим текстом. Зберігайте хеш (PBKDF2/Argon2) і перевіряйте через check_password_hash().
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-256: Plaintext Storage of a Password", owasp: "A02:2021 Cryptographic Failures"}
    pattern-either:
      - pattern: $ROW["password"] == $P
      - pattern: $P == $ROW["password"]

  - id: hardcoded-secret-key-fallback
    message: Секретний ключ має значення за замовчуванням у коді. Ключ має надходити лише із секретів/ENV, без запасного значення.
    severity: WARNING
    languages: [python]
    metadata: {cwe: "CWE-798: Hard-coded Credentials", owasp: "A07:2021 Identification and Authentication Failures"}
    pattern: $APP.secret_key = os.environ.get("SECRET_KEY", "...")

  - id: flask-debug-enabled
    message: Режим debug=True вмикає інтерактивний відладчик Werkzeug (виконання коду). Не використовуйте в розгорнутому застосунку.
    severity: WARNING
    languages: [python]
    metadata: {cwe: "CWE-489: Active Debug Code", owasp: "A05:2021 Security Misconfiguration"}
    pattern: $APP.run(..., debug=True, ...)
