name: SAST
on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write   # потрібно для завантаження SARIF у вкладку Security -> Code scanning
  actions: read

jobs:
  semgrep-bandit-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "bandit[sarif]" semgrep
      - name: Semgrep (registry rules + project rules)
        run: semgrep scan --config auto --config .semgrep.yml --sarif --output semgrep.sarif || true
      - name: Bandit
        run: bandit -r src -f sarif -o bandit.sarif || true
      - name: pip-audit
        run: pip-audit -r requirements.txt -f json -o pip-audit.json || true
      - name: Upload SARIF (Semgrep)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Upload SARIF (Bandit)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            semgrep.sarif
            bandit.sarif
            pip-audit.json
      - name: Security gate (project rules)
        run: semgrep scan --config .semgrep.yml --error --metrics off
