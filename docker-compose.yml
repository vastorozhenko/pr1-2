services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is not set (see .env)}
      - DB_PATH=/data/demo.sqlite3
    volumes:
      - appdata:/data   # іменований том: отримує власника appuser з образу
    command: /bin/sh -c "python src/db.py && flask run --host=0.0.0.0 --port=5000"

volumes:
  appdata:
